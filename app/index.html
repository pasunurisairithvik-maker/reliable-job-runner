<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Runner</title><style>body{font:17px system-ui;background:#f2f5fa;color:#172338;max-width:760px;margin:40px auto;padding:24px}main{background:white;padding:30px;border-radius:16px}input,textarea{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin:8px 0}button{background:#2359c4;color:white;border:0;border-radius:8px;padding:12px;margin:10px 0;cursor:pointer}pre{white-space:pre-wrap;background:#eef2f8;padding:20px}label input[type=checkbox]{width:auto}</style><main><h1>Reliable Job Runner</h1><p>Submit a word-count task. The separate Python worker executes it.</p><form id="form"><label for="key">Request key (reuse it to test duplicate prevention)</label><input id="key" value="demo-1" required maxlength="100"><label for="text">Text</label><textarea id="text" required maxlength="10000">Python makes practical projects possible</textarea><label><input type="checkbox" id="fail">Simulate one temporary failure</label><br><button>Queue job</button></form><button id="refresh" disabled>Refresh job status</button><pre id="result" aria-live="polite">Start the API and worker in two terminals.</pre></main><script>let jobId=null;const output=document.getElementById('result');document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();try{const response=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'word_count',payload:{text:document.getElementById('text').value},request_key:document.getElementById('key').value,fail_first:document.getElementById('fail').checked})});const body=await response.json();output.textContent=JSON.stringify(body,null,2);if(response.ok){jobId=body.job.id;document.getElementById('refresh').disabled=false}}catch(error){output.textContent='Cannot reach the local server.'}};document.getElementById('refresh').onclick=async()=>{try{const response=await fetch('/jobs/'+jobId);output.textContent=JSON.stringify(await response.json(),null,2)}catch(error){output.textContent='Cannot reach the local server.'}};</script></html>
